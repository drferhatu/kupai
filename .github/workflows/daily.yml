name: KupAI günlük güncelleme

# Maç sonuçlarını çek, puanla, siteyi yeniden kur ve GitHub Pages'e yayınla.
# Sadece football-data.org çağrısı yapar (tek istek) — LLM harcaması YOK.
on:
  schedule:
    # Saatler UTC (TR = UTC+3). WC maçları TR'de yalnızca ~21:00–09:00 arası biter;
    # gündüz maç olmadığından geçişler gece/sabaha yoğunlaşır.
    - cron: "45 21 * * *"   # 00:45 TR — akşam + gece yarısı kümesi (en yoğun), ilk skorlar
    - cron: "30 0 * * *"    # 03:30 TR — gece geç biten maçlar
    - cron: "30 3 * * *"    # 06:30 TR — sabaha karşı biten maçlar
    - cron: "30 6 * * *"    # 09:30 TR — sabah biten son maçlar
    - cron: "15 9 * * *"    # 12:15 TR — gündüz yedek (skor düzeltmeleri için)
  workflow_dispatch: {}   # elle de tetiklenebilir

permissions:
  contents: write   # güncellenen matches.json'u geri commit etmek için
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fikstür + sonuçları senkronla
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: PYTHONPATH=src python src/fixtures.py

      - name: Siteyi kur
        run: PYTHONPATH=src python src/build_site.py

      - name: Güncellenen veriyi geri commit et
        run: |
          git config user.name "KupAI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json
          git commit -m "Otomatik güncelleme: maç sonuçları" || echo "Değişiklik yok"
          git push || echo "Push edilecek bir şey yok"

      - name: Pages artifact yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
